<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Login — Vidya Setu</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--tr:background .3s,color .3s,border-color .3s;}
[data-theme="light"]{--bg:#f2ede4;--bg2:#ede7db;--text:#1a1712;--text2:#5c5649;--text3:#9a9080;--warm:#7a5c38;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.15);--card:#fff8f0;--input-bg:#ede7db;--nav-bg:rgba(242,237,228,0.93);--btn-bg:#1a1712;--btn-text:#f2ede4;--toggle-bg:#d4c9b5;--err-bg:#fee2e2;--err-text:#b91c1c;--shadow:0 4px 32px rgba(0,0,0,0.08);}
[data-theme="dark"]{--bg:#0f0f0e;--bg2:#1a1915;--text:#f0ebe0;--text2:#9a9488;--text3:#6b665e;--warm:#c4a882;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);--card:#1e1c18;--input-bg:#252420;--nav-bg:rgba(15,15,14,0.93);--btn-bg:#f0ebe0;--btn-text:#0f0f0e;--toggle-bg:#3a3830;--err-bg:rgba(248,113,113,0.1);--err-text:#f87171;--shadow:0 4px 32px rgba(0,0,0,0.3);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:var(--tr);}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 48px;background:var(--nav-bg);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);transition:var(--tr);}
.nav-logo{display:flex;align-items:center;gap:9px;text-decoration:none;}
.nav-mark{width:30px;height:30px;background:var(--text);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .3s;}
.nav-logo-text{font-family:'Lora',serif;font-size:17px;color:var(--text);transition:color .3s;}
.nav-right{display:flex;align-items:center;gap:10px;}
.theme-toggle{width:32px;height:32px;background:var(--toggle-bg);border:1px solid var(--border2);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.back-link{font-size:13px;font-weight:500;color:var(--text2);text-decoration:none;transition:color .2s;}
.back-link:hover{color:var(--text);}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 20px 40px;}
.box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 40px;width:100%;max-width:400px;box-shadow:var(--shadow);transition:var(--tr);animation:fadeUp .5s ease both;}
.box-top{text-align:center;margin-bottom:32px;}
.box-avatar{width:60px;height:60px;border-radius:14px;background:var(--bg2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
.box-top h1{font-family:'Lora',serif;font-size:24px;font-weight:400;color:var(--text);margin-bottom:5px;}
.box-top p{font-size:13px;color:var(--text3);line-height:1.6;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.pw-wrap{position:relative;}
.field input{width:100%;background:var(--input-bg);border:1px solid var(--border2);border-radius:9px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:15px;color:var(--text);outline:none;transition:var(--tr);}
.field input:focus{border-color:var(--warm);box-shadow:0 0 0 3px rgba(122,92,56,0.1);}
.pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;}
.login-btn{width:100%;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:9px;padding:13px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:opacity .2s,background .3s,color .3s;}
.login-btn:hover{opacity:.82;}
.login-btn:disabled{opacity:.45;cursor:not-allowed;}
.err{background:var(--err-bg);border:1px solid rgba(248,113,113,0.3);color:var(--err-text);border-radius:9px;padding:11px 14px;font-size:13px;font-weight:500;margin-top:12px;display:none;text-align:center;}
.err.show{display:block;animation:shake .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:480px){nav{padding:14px 18px;}.box{padding:32px 20px;}}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">
    <div class="nav-mark">🏫</div>
    <span class="nav-logo-text">Vidya Setu</span>
  </a>
  <div class="nav-right">
    <a class="back-link" href="index.html">← Home</a>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</nav>
<main>
  <div class="box">
    <div class="box-top">
      <div class="box-avatar">🔐</div>
      <h1>Teacher Login</h1>
      <p>Sign in to access your class register</p>
    </div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="u" placeholder="Enter username" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('p').focus()">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="p" placeholder="Enter password" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pw-eye" onclick="togglePw()" id="eyeBtn">👁</button>
      </div>
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Login →</button>
    <div class="err" id="err">Incorrect username or password</div>
  </div>
</main>
<script src="db.js"></script>
<script>
let tries=0;
const MAX=5;
function doLogin(){
  const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
  const c=DB.getCreds(),err=document.getElementById('err'),btn=document.getElementById('loginBtn');
  if(u===c.username&&p===c.password){
    DB.setLoggedIn();btn.textContent='Opening…';btn.disabled=true;
    setTimeout(()=>window.location.href='attendance.html',400);
  } else {
    tries++;err.classList.remove('show');void err.offsetWidth;
    err.textContent=tries>=MAX?'🔒 Too many attempts. Refresh the page.':`Incorrect username or password (${MAX-tries} left)`;
    err.classList.add('show');
    if(tries>=MAX){['u','p'].forEach(id=>document.getElementById(id).disabled=true);btn.disabled=true;}
  }
}
function togglePw(){const i=document.getElementById('p'),e=document.getElementById('eyeBtn');i.type=i.type==='password'?'text':'password';e.textContent=i.type==='password'?'👁':'🙈';}
const root=document.documentElement,btn=document.getElementById('themeBtn');
applyTheme(DB.getTheme());
function applyTheme(t){root.setAttribute('data-theme',t);btn.textContent=t==='dark'?'☀️':'🌙';DB.setTheme(t);}
function toggleTheme(){applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');}
</script>
</body>
</html>
